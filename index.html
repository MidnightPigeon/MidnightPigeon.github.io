<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MidnightPigeon 的个人主页，记录项目、想法与联系方式。">
    <title>MidnightPigeon</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>MidnightPigeon</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#about">ABOUT</a>
        <a href="#projects">WORK</a>
        <a href="#essays">ESSAYS</a>
        <a href="#contact">LINKS</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换明暗主题" data-theme-toggle>
        <span data-theme-icon aria-hidden="true">DARK</span>
      </button>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">ROOT / PERSONAL PAGE</p>
          <h1 id="hero-title">Midnight's<br>Personal Page</h1>
        </div>

        <aside class="pixel-window" aria-label="站点摘要">
          <div class="window-bar">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="pixel-face" data-pixel-board aria-hidden="true"></div>
        </aside>
      </section>

      <section class="section" id="about" aria-labelledby="about-title">
        <div class="section-heading">
          <p class="eyebrow">01 / ABOUT</p>
          <h2 id="about-title">关于我</h2>
        </div>
        <div class="text-panel" data-about-panel>
          <p data-about-body>Loading profile...</p>
          <ul class="tag-list" aria-label="关键词" data-about-tags></ul>
        </div>
      </section>

      <section class="section" id="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <p class="eyebrow">02 / PROJECTS</p>
          <h2 id="projects-title">项目</h2>
        </div>
        <div class="card-grid" data-project-list></div>
      </section>

      <section class="section" id="essays" aria-labelledby="essays-title">
        <div class="section-heading">
          <p class="eyebrow">03 / ESSAYS</p>
          <h2 id="essays-title">随想集</h2>
        </div>
        <div class="essay-tools">
          <label class="search-box">
            <span>SEARCH</span>
            <input type="search" placeholder="查找标题、标签或摘要" data-essay-search>
          </label>
          <button class="refresh-button secondary-action" type="button" data-essay-submit>查找</button>
          <button class="refresh-button" type="button" data-essay-refresh>随便看看</button>
        </div>
        <div class="essay-grid" data-essay-list aria-live="polite"></div>
        <div class="essay-preview" data-essay-preview hidden>
          <div class="preview-window">
            <div class="window-bar">
              <span></span>
              <span></span>
              <span></span>
              <button type="button" aria-label="关闭预览" data-preview-close>关闭</button>
            </div>
            <article class="preview-body" data-preview-body></article>
          </div>
        </div>
      </section>

      <section class="section" id="contact" aria-labelledby="contact-title">
        <div class="section-heading">
          <p class="eyebrow">04 / LINKS</p>
          <h2 id="contact-title">站点链接</h2>
        </div>
        <div class="contact" data-link-list></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> MidnightPigeon</span>
      <a href="#top">BACK TO TOP</a>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
